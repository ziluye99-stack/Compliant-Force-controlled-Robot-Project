name: reproducibility-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"

      - name: Validate branch task and evidence policy
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          branch_name="${PR_BRANCH:-main}"
          python scripts/check-branch-task.py --branch "$branch_name"
          python scripts/check-literature-sources.py configs/literature_sources.yaml
          python scripts/check-paper-notes.py

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run MuJoCo smoke checks
        run: |
          python -m src.experiment --config configs/sim.yaml --dry-run
          python -m src.mujoco_smoke --steps 100
