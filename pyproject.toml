[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compliant-force-robot"
version = "0.1.0"
description = "Reproducible workflow scaffold for compliant force-control research"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.2,<4",
  "numpy",
  "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
