defaults:
  - contact_force_robust

experiment:
  name: normal-force-residual-policy

learning:
  method: linear_residual_ridge
  episodes: 8
  steps_per_episode: 500
  ridge: 0.001
  train_fraction_by_episode: 0.8
  residual_limit_n: 10.0
  train_target_force_range_n: [3.0, 7.0]

heldout:
  target_force_n: [4.0, 6.0]
  damping_scale: [1.2, 1.8]
  actuator_gain: [0.9, 0.7]
  seeds: [101, 202, 303]

evaluation:
  steps: 1000
  seed: 123
